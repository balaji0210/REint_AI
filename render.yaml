services:
  - type: web
    name: wind-forecast-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: "*"
      - key: CACHE_DIR
        value: /tmp/cache
    healthCheckPath: /api/health
    autoDeploy: true
